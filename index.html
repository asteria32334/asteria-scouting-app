<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asteria Scouting - Giriş</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="glass-card login-box">
      <div style="text-align: center; margin-bottom: 24px;">
        <span class="nav-badge">FTC BIOBUZZ</span>
        <h1 style="font-size: 1.8rem; margin-top: 8px;">Asteria Scouting</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Maç verilerini kaydetmek için ismini gir</p>
      </div>

      <div class="form-group">
        <label for="scoutName">İsminiz</label>
        <input type="text" id="scoutName" placeholder="Örn: Ahmet">
      </div>
      <button class="btn btn-primary btn-block" onclick="startScouting()">Scouting Yapmaya Başla</button>

      <hr class="divider">

      <div class="form-group">
        <label for="adminPass">Admin Girişi</label>
        <input type="password" id="adminPass" placeholder="Admin Şifresi">
      </div>
      <button class="btn btn-secondary btn-block" onclick="loginAdmin()">Admin Paneli</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    // Daha önce giriş yapıldıysa ismi otomatik doldur
    const savedName = localStorage.getItem('asteria_scout_name');
    if (savedName) document.getElementById('scoutName').value = savedName;

    function startScouting() {
      const name = document.getElementById('scoutName').value.trim();
      if (!name) {
        showToast('Lütfen isminizi girin.');
        return;
      }
      localStorage.setItem('asteria_scout_name', name);
      localStorage.removeItem('asteria_edit_record');
      window.location.href = 'scouting.html';
    }

    function loginAdmin() {
      const pass = document.getElementById('adminPass').value;
      if (pass === 'asteria2026') {
        sessionStorage.setItem('asteria_admin_auth', 'true');
        window.location.href = 'admin.html';
      } else {
        showToast('Hatalı admin şifresi!');
      }
    }
  </script>
</body>
</html>
